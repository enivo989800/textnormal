plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noteduo.textcaddy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.noteduo.textcaddy'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
